<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#202f24">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./touch.png">
<link rel="icon" href="./icon-192.png">
<title>Tamago · La caccia</title>
</head>
<body>
<main class="shell">
  <header>
    <h1>Tamago</h1>
    <div class="scores">
      <span id="level" class="level">Livello 1</span>
      <output id="time" aria-label="Secondi rimanenti">60 s</output>
      <output id="score" aria-label="Catture">0 catture</output>
      <output id="strands" aria-label="Fili fissati">0 / 6 fili</output>
    </div>
    <div class="tools">
      <button id="sound" type="button" aria-pressed="true">Audio On</button>
    </div>
  </header>
  <section class="stage" aria-label="Arena di caccia">
    <canvas id="world" width="360" height="204" aria-label="Ragno, mosca e ragnatele"></canvas>
  </section>
  <footer>
    <p id="message" role="status">Collega il joypad PlayStation e premi un tasto.</p>
    <p>Sinistro: corri sulle superfici, ↑ risali, ↓ stacca dal filo · Destro: mira · <kbd>R1</kbd> Tela · <kbd>L1</kbd> Salto / doppio salto</p>
  </footer>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>

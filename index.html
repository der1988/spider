<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c5cf91">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./touch.png">
<link rel="icon" href="./icon-192.png">
<title>Tamago · Il sentiero di seta</title>
</head>
<body>
<main class="scene">
  <canvas id="world" aria-label="Il ragno e il sottobosco"></canvas>
  <header class="hud">
    <div><span class="brand">TAMAGO</span><h1>Il sentiero di seta</h1></div>
    <div class="tools">
      <output id="web-count" aria-label="Ragnatela">0 fili · 0 mosche</output>
      <span id="altitude" aria-hidden="true">Quota 0</span>
      <button id="sound" type="button" aria-pressed="true">Audio On</button>
      <details id="tuning">
        <summary>Fisica</summary>
        <div class="settings">
          <label>Portata <output id="range-value"></output><input id="range" type="range" min="100" max="220" step="1"></label>
          <label>Accelerazione <output id="acceleration-value"></output><input id="acceleration" type="range" min="180" max="720" step="10"></label>
          <label>Risalita <output id="reelSpeed-value"></output><input id="reelSpeed" type="range" min="30" max="120" step="1"></label>
          <button id="reset-tuning" type="button">Valori iniziali</button>
        </div>
      </details>
    </div>
  </header>
  <footer class="controls">
    <p id="message" role="status"></p>
    <p id="gamepad-guide" class="keys" hidden>
      Sinistro: muovi, ↑ risali, ↓ stacca · Destro: mira · <kbd>R1</kbd> Tela · <kbd>L1</kbd> Salto
    </p>
  </footer>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>

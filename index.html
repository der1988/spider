<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="tamago-soundtrack" content="./the-fly-has-ai.mp3">
<meta name="tamago-upgrade" content="./the-fly-has-an-upgrade.mp3">
<meta name="tamago-room" content="./the-room-has-a-space-bar.mp3">
<meta name="tamago-fly" content="./the-fly-is-you.mp3">
<meta name="tamago-loop" content="./infinite-loop.mp3">
<meta name="theme-color" content="#202f24">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./touch.png">
<link rel="icon" href="./icon-192.png">
<title>Spider and Fly</title>
</head>
<body>
<main id="shell" class="shell" data-screen="start">
  <section id="launch" class="launch" aria-labelledby="launch-title">
    <div class="launch-copy">
      <h1 id="launch-title">Spider and Fly</h1>
      <p>Use your controller</p>
    </div>
    <div class="mode-choices">
      <button id="story" type="button" data-selected="true"><span>Story</span><code aria-hidden="true">story()</code></button>
      <button id="loop" type="button" data-selected="false"><span>Infinite Loop</span><code aria-hidden="true">loop()</code></button>
    </div>
    <p id="start-status" role="status"></p>
  </section>
  <header>
    <div class="hunt-info">
      <h1>Spider and Fly</h1>
      <div class="catch-count">
        <label for="score">Catches</label>
        <output id="score">0</output>
      </div>
    </div>
    <div id="clock" class="clock" data-phase="ready">
      <span class="clock-caption">Time · <span id="round-time">60 s</span></span>
      <span class="clock-rhythm" aria-hidden="true"></span>
      <output id="time" aria-label="Seconds remaining" aria-live="off">60 s</output>
      <span class="clock-rhythm" aria-hidden="true"></span>
      <div class="clock-track" aria-hidden="true"><span id="clock-meter"></span></div>
    </div>
    <code id="ending-code" class="ending-code" aria-hidden="true"></code>
  </header>
  <section class="stage" aria-label="Hunting arena">
    <canvas id="world" width="360" height="204" aria-label="Spider, fly and webs"></canvas>
    <section id="loop-defeat" class="defeat" aria-labelledby="defeat-title" hidden>
      <div class="defeat-panel">
        <h2 id="defeat-title">Time ran out</h2>
        <div class="defeat-score">
          <label for="defeat-score">Total catches</label>
          <output id="defeat-score">0</output>
        </div>
        <div class="mode-choices">
          <button id="main-menu" type="button" data-selected="false">Main Menu</button>
          <button id="retry" type="button" data-selected="true">Retry</button>
        </div>
      </div>
    </section>
  </section>
  <footer>
    <p id="message" role="status"></p>
    <p id="lyric" class="lyric" lang="en"></p>
  </footer>
</main>
<dialog id="scoreboard" aria-labelledby="board-title">
  <div class="board-header">
    <h2 id="board-title">Leaderboard</h2>
    <button id="board-close" type="button">Close</button>
  </div>
  <p id="board-status" role="status"></p>
  <button id="board-reload" type="button" hidden>Try again</button>
  <ol id="board-entries" aria-label="Leaderboard by catches"></ol>
</dialog>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
